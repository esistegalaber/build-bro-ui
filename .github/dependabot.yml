# Keeps the SHA-pinned actions in .github/workflows up to date: Dependabot opens a PR with the new
# commit SHA (and updates the version comment) when an action releases a new version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The base images in the Dockerfile, pinned by digest: Dependabot updates the tag and the digest.
  # The docker job in build.yml builds, scans and smoke-tests every such PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
