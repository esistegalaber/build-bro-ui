name: Build UI

on:
  push:
    branches: [ "main" ]
    # A GitHub release vX.Y.Z (on a main commit) publishes the image X.Y.Z, X.Y and latest (#86)
    tags: [ "v*" ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

# One run per ref at a time. On main, runs queue, so the main image always ends on the newest commit (a
# pending run is replaced by a newer one, so a commit in between may get no image). On PRs, a new push
# cancels the running one: its image would be replaced anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Four jobs: the unit tests and the build run in parallel; SonarCloud starts as soon as the
# unit tests have produced the coverage report; the Docker image job waits for both.
# Actions are pinned to full commit SHAs (a tag can be moved to other code); the comment names the version.
# The Angular 22 CLI needs Node ^22.22.3, ^24.15 or >=26; builds and tests are verified on 26.
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The unit tests need no install scripts, so none run here.
      - name: Install
        run: npm ci --ignore-scripts

      # The copy of the API contract must match build-bro-api's main, and the generated types must match the copy
      - name: API contract up to date
        run: npm run api:check

      # Vitest with coverage; writes coverage/build-bro-ui/lcov.info
      - name: Unit tests
        run: npm test -- --watch=false --coverage

      # The SonarCloud job reads the coverage report from here.
      - name: Keep the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/build-bro-ui/lcov.info
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The build needs no install scripts (esbuild and friends ship prebuilt binaries)
      - name: Install
        run: npm ci --ignore-scripts

      # The flows across pages are tested against the live stack in build-bro-acceptance (Playwright)
      - name: Build
        run: npm run build

  sonarcloud:
    name: SonarCloud
    # needs the coverage report of the unit tests, but still runs when they failed. Not on release tags:
    # Sonar would show each one as a branch.
    needs: unit
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Get the coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage/build-bro-ui
      # sonarcloud-github-action is archived; sonarqube-scan-action replaces it and talks to SonarQube Cloud
      # by default. The project and organization keys come from sonar-project.properties.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Builds, scans and smoke-tests the Docker image (#81), then publishes exactly that image to GHCR (#86).
  # Runs after the unit tests and the build, so nothing is built or published when either fails; the push
  # is the last step, so only an image that passed Trivy and the smoke test is published.
  docker:
    name: Docker image
    needs: [ unit, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Dependabot and fork PRs get a read-only token: their image is built and checked, but not published
      CAN_PUBLISH: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Tags: pr-<N> on PRs; main and sha-<7> on main; X.Y.Z, X.Y and latest (flavor latest=auto: release
      # tags that aren't pre-releases) on vX.Y.Z tags. Plus the OCI labels version, revision and created.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # metadata-action takes the description from the GitHub repo's (empty), which would overwrite the
          # Dockerfile's label; keep this text in step with it
          labels: |
            org.opencontainers.image.description=Build Bruh UI: the Angular app, served by nginx, with /api passed on to the API
      # amd64 only; the Dockerfile is architecture-neutral, so it also builds natively on arm64
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: build-bro-ui:ci
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: build-bro-ui:ci
          # The action's default Trivy (v0.70.0) failed to install; Dependabot doesn't update this, so bump it by hand
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Check that the image doesn't run as root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' build-bro-ui:ci)
          echo "Image user: '$user'"
          case "$user" in ""|0|0:*|root|root:*) echo "::error::The image runs as root"; exit 1;; esac
      # The UI starts read-only before its API exists (/api answers 502), then a stub API comes up and /api
      # works without restarting the UI. The stub echoes the URL it got, so the pass-through is checked too.
      - name: Smoke test
        run: |
          set -u
          fail() { echo "::error::$1"; exit 1; }
          expect() { [ "$2" = "$3" ] || fail "$1: expected '$3', got '$2'"; echo "ok: $1"; }
          docker network create smoke
          docker run -d --name ui --network smoke --read-only --tmpfs /tmp -p 4200:8080 \
            -e BUILDZ_API=api-stub build-bro-ui:ci
          ui=http://localhost:4200
          for _ in $(seq 1 30); do curl -fs -o /dev/null "$ui/" && break; sleep 1; done

          expect "/" "$(curl -s -o /dev/null -w '%{http_code}' "$ui/")" 200
          expect "deep link /builds" "$(curl -s -o /dev/null -w '%{http_code}' "$ui/builds")" 200
          curl -s "$ui/builds" | grep -q '<bz-root>' || fail "deep link doesn't return the app"
          expect "/api without the API" "$(curl -s -o /dev/null -w '%{http_code}' "$ui/api/v1/stats")" 502

          headers=$(curl -sI "$ui/")
          echo "$headers"
          echo "$headers" | grep -qi "^content-security-policy: .*script-src 'self';" || fail "no strict CSP"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff' || fail "no nosniff header"
          echo "$headers" | grep -qi '^cache-control: no-cache' || fail "index.html isn't revalidated"
          echo "$headers" | grep -qiE '^server: nginx/' && fail "the Server header shows the nginx version"
          curl -s "$ui/" | grep -q '<script>' && fail "index.html has an inline script (the CSP blocks it)"
          js=$(curl -s "$ui/" | grep -o 'main-[A-Za-z0-9_-]*\.js' | head -1)
          js_headers=$(curl -s -o /dev/null -D - -H 'Accept-Encoding: gzip' "$ui/$js")
          echo "$js_headers" | grep -qi 'cache-control: .*immutable' || fail "$js isn't cached long-term"
          echo "$js_headers" | grep -qi 'content-encoding: gzip' || fail "$js isn't gzipped"

          docker run -d --name api-stub --network smoke node:26-alpine node -e \
            "require('http').createServer((q,s)=>{s.setHeader('content-type','application/json');s.end(JSON.stringify({url:q.url}))}).listen(8080)"
          for _ in $(seq 1 30); do
            body=$(curl -fs "$ui/api/v1/stats?probe=1") && break
            sleep 1
          done
          expect "/api once the API is up" "${body:-}" '{"url":"/api/v1/stats?probe=1"}'
      - name: Container logs
        if: failure()
        run: docker logs ui || true
      # Publishes the image that was just tested (retagged, not rebuilt)
      - name: Log in to GHCR
        if: env.CAN_PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        if: env.CAN_PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag build-bro-ui:ci "$tag"
            docker push "$tag"
          done
          {
            echo "### Published"
            for tag in $TAGS; do echo "- \`$tag\`"; done
            echo
            echo "Digest: \`$(docker inspect --format '{{index .RepoDigests 0}}' build-bro-ui:ci)\`"
          } >> "$GITHUB_STEP_SUMMARY"
