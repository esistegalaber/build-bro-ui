sonar.projectKey=esistegalaber_build-bro-ui
sonar.organization=esistegalaber
sonar.sourceEncoding=UTF-8

# The app code is the source; unit specs, test helpers and the Cypress e2e suite are tests.
sonar.sources=src
sonar.exclusions=src/**/*.spec.ts,src/testing/**
sonar.tests=src,cypress
sonar.test.inclusions=src/**/*.spec.ts,src/testing/**,cypress/**

# Coverage comes from the Vitest unit tests (npm test -- --watch=false --coverage); CI hands the report to the
# SonarCloud job. Files without logic to unit-test are left out, the same list as coverageExclude in angular.json.
sonar.javascript.lcov.reportPaths=coverage/build-bro-ui/lcov.info
sonar.coverage.exclusions=src/main.ts,src/environments/**,src/**/*.routes.ts,src/**/*.actions.ts,src/app/core/actions.ts
