sonar.projectKey=esistegalaber_build-bro-ui
sonar.organization=esistegalaber
sonar.sourceEncoding=UTF-8

# SonarCloud's analysis scope covers the whole repository: sonar.sources, sonar.tests and sonar.test.inclusions
# have no effect any more, only exclusions narrow it down.
# Unit specs, test helpers, the types generated from the API contract (src/app/core/api) and testdata.sql (a copy of
# build-bro-api's test data, whose DELETEs without WHERE are on purpose) are not analyzed at all.
sonar.exclusions=src/**/*.spec.ts,src/testing/**,src/app/core/api/**,testdata.sql

# Coverage comes from the Vitest unit tests (npm test -- --watch=false --coverage); CI hands the report to the
# SonarCloud job. The Cypress suite and scripts/ (tooling) are analyzed for issues but not counted for coverage.
# Files without logic are left out too, the same list as coverageExclude in angular.json.
sonar.javascript.lcov.reportPaths=coverage/build-bro-ui/lcov.info
sonar.coverage.exclusions=cypress/**,scripts/**,cypress.config.ts,src/main.ts,src/environments/**,src/**/*.routes.ts,src/**/*.actions.ts,src/app/core/actions.ts
