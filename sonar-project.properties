sonar.projectKey=esistegalaber_build-bro-ui
sonar.organization=esistegalaber
# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=build-bro-ui
#sonar.projectVersion=0.1.0
# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=./src/app
# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
# The app has no unit tests: the Cypress e2e specs are the test suite and produce no coverage report yet.
# Without this, Sonar's "coverage on new code >= 80%" condition fails every PR that changes code.
# Remove it once e2e coverage is reported (see the Cypress code coverage ticket).
sonar.coverage.exclusions=**/*
