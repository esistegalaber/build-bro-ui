# Security headers for every response. nginx drops inherited add_header lines in a block that has its own,
# so each location that adds a header includes this file again.
# No inline scripts: critical-CSS inlining is off in angular.json. Styles need 'unsafe-inline' (Angular adds
# component styles as <style> elements).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
