# The base image's nginx.conf (pid and temp paths in /tmp), plus: no version in responses, gzip, and the
# server config rendered at startup into /tmp/conf.d, so the root filesystem can be read-only.
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # No nginx version in the Server header and on error pages
    server_tokens off;

    # Text is compressed at run time; the app and the /api JSON alike (text/html is always included)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml
               image/svg+xml image/x-icon;

    # Rendered by the entrypoint from /etc/nginx/templates/conf.d/default.conf.template
    include /tmp/conf.d/*.conf;
}
